<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#123125">
<title>Truco de Boteco</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ========== TÍTULO ========== -->
  <section id="screen-title" class="screen screen--on screen--title">
    <div class="title__art"></div>
    <div class="title__logo">
      <svg viewBox="0 0 48 32" class="logo" aria-label="Truco de Boteco">
        <g shape-rendering="crispEdges">
          <rect x="4" y="8" width="16" height="22" fill="#f4ead2" stroke="#0b160f" stroke-width="2"/>
          <rect x="16" y="4" width="16" height="22" fill="#f4ead2" stroke="#0b160f" stroke-width="2"/>
          <rect x="28" y="8" width="16" height="22" fill="#f4ead2" stroke="#0b160f" stroke-width="2"/>
          <path fill="#c0392b" d="M10 15h4v2h-1v2h-2v-2h-1z"/>
          <path fill="#e8b93c" d="M21 12h6v6h-6z M22 11h4v1h-4z M22 18h4v1h-4z"/>
          <path fill="#1f6b3a" d="M34 14h4v2h-1v6h-2v-6h-1z M33 18h2v1h-2z M37 18h2v1h-2z"/>
        </g>
      </svg>
      <h1 class="title__name">TRUCO<span>DE BOTECO</span></h1>
      <p class="title__tag" data-t="tagline"></p>
      <p class="title__cta">▸ toque para jogar ◂</p>
    </div>
  </section>

  <!-- ========== MENU ========== -->
  <section id="screen-menu" class="screen screen--menu">
    <header class="brand">
      <svg viewBox="0 0 48 32" class="brand__logo" aria-hidden="true" shape-rendering="crispEdges">
        <rect x="4" y="8" width="16" height="22" fill="#f4ead2" stroke="#0b160f" stroke-width="2"/>
        <rect x="16" y="4" width="16" height="22" fill="#f4ead2" stroke="#0b160f" stroke-width="2"/>
        <rect x="28" y="8" width="16" height="22" fill="#f4ead2" stroke="#0b160f" stroke-width="2"/>
        <path fill="#c0392b" d="M10 15h4v2h-1v2h-2v-2h-1z"/>
        <path fill="#e8b93c" d="M21 12h6v6h-6z M22 11h4v1h-4z M22 18h4v1h-4z"/>
        <path fill="#1f6b3a" d="M34 14h4v2h-1v6h-2v-6h-1z M33 18h2v1h-2z M37 18h2v1h-2z"/>
      </svg>
      <h2>TRUCO <em>DE BOTECO</em></h2>
    </header>
    <nav class="menu">
      <button id="btn-play" class="btn btn--big" data-t="play"></button>
      <button id="btn-story" class="btn btn--big btn--alt" data-t="story"></button>
      <button id="btn-tutorial" class="btn" data-t="tutorial"></button>
      <button id="btn-ranking" class="btn" data-t="ranking"></button>
      <button id="btn-collection" class="btn" data-t="collection"></button>
      <button id="btn-settings" class="btn" data-t="settings"></button>
    </nav>
    <footer class="menu__foot">v1.5</footer>
  </section>

  <!-- ========== CONFIG ========== -->
  <section id="screen-config" class="screen screen--panel">
    <header class="panel__head"><button class="btn btn--icon" data-back="menu">◀</button><h2 data-t="play"></h2></header>
    <div id="config-body" class="panel__body"></div>
    <div class="panel__foot"><button id="btn-start" class="btn btn--big btn--accept" data-t="start"></button></div>
  </section>

  <!-- ========== TUTORIAL ========== -->
  <section id="screen-tutorial" class="screen screen--panel">
    <header class="panel__head"><button class="btn btn--icon" data-back="menu">◀</button><h2 data-t="tutorial"></h2></header>
    <div id="tut-body" class="panel__body panel__body--tut"></div>
    <div class="panel__foot panel__foot--row">
      <button id="tut-skip" class="btn btn--run" data-t="skip"></button>
      <button id="tut-next" class="btn btn--accept" data-t="next"></button>
    </div>
  </section>

  <!-- ========== RANKING ========== -->
  <section id="screen-ranking" class="screen screen--panel">
    <header class="panel__head"><button class="btn btn--icon" data-back="menu">◀</button><h2 data-t="ranking"></h2></header>
    <div id="rank-body" class="panel__body"></div>
    <p class="note note--pad">Ranking online, ligas e temporadas entram na fase 2 (ver documento de design).</p>
  </section>

  <!-- ========== AJUSTES ========== -->
  <section id="screen-settings" class="screen screen--panel">
    <header class="panel__head"><button class="btn btn--icon" data-back="menu">◀</button><h2 data-t="settings"></h2></header>
    <div class="panel__body">
      <h4 class="opt-h" data-t="opt_general"></h4>
      <button id="lang-btn" class="row-btn"><span data-t="language"></span><b id="lang-value"></b></button>
      <button id="music-btn" class="row-btn"><span data-t="music"></span><b id="music-value"></b></button>
      <button id="sfx-btn" class="row-btn"><span data-t="sfx"></span><b id="sfx-value"></b></button>
      <div id="opts-body" class="opts"></div>
    </div>
  </section>

  <!-- ========== MESA ========== -->
  <section id="screen-game" class="screen screen--game">
    <header class="topbar">
      <div class="score">
        <span class="score__lbl" id="label-us"></span><b id="score-us">0</b>
      </div>
      <div class="topbar__mid">
        <div class="pill"><span id="hand-value-lbl"></span> <b id="hand-value">1</b></div>
        <div class="rounds" id="rounds"></div>
      </div>
      <div class="score score--them">
        <b id="score-them">0</b><span class="score__lbl" id="label-them"></span>
      </div>
      <button id="btn-match-opts" class="btn btn--icon btn--gear" data-t-title="settings"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M7 0h2v2h2V1h2v2h-1v2h2v2h2v2h-2v2h-2v2h1v2h-2v-1H9v2H7v-2H5v1H3v-2h1v-2H2V9H0V7h2V5h2V3H3V1h2v1h2zM6 6v4h4V6z"/></svg></button>
      <button id="btn-quit-match" class="btn btn--icon btn--quit">✕</button>
    </header>

    <div class="vira-box">
      <span class="vira-box__lbl" id="vira-lbl"></span>
      <div id="vira"></div>
    </div>

    <div id="table" class="table">
      <div id="slots" class="layer"></div>
      <div id="seats" class="layer"></div>
      <div id="toast" class="toast"></div>
    </div>

    <div id="partner-peek" class="peek"></div>

    <div id="timer" class="timer"><i id="timer-bar"></i></div>
    <div id="actions" class="actions"></div>
    <div id="hand" class="hand"></div>

  </section>

  <!-- ========== MUNDO ABERTO ========== -->
  <section id="screen-world" class="screen screen--world">
    <div class="world__wrap"><canvas id="world-canvas"></canvas></div>
    <div class="world__top">
      <button class="btn btn--icon" data-back="menu">◀</button>
      <span id="world-hud" class="world__hud"></span>
      <button id="btn-world-opts" class="btn btn--icon btn--gear" data-t-title="settings"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M7 0h2v2h2V1h2v2h-1v2h2v2h2v2h-2v2h-2v2h1v2h-2v-1H9v2H7v-2H5v1H3v-2h1v-2H2V9H0V7h2V5h2V3H3V1h2v1h2zM6 6v4h4V6z"/></svg></button>
      <button id="btn-notebook" class="btn btn--icon" title="Caderneta"></button>
    </div>
    <p id="world-hint" class="world__hint"></p>
    <div id="dpad" class="dpad">
      <button data-dir="up">▲</button>
      <button data-dir="left">◀</button>
      <button data-dir="right">▶</button>
      <button data-dir="down">▼</button>
      <div class="dpad__hub"><div class="dpad__nub"></div></div>
    </div>
    <button id="run-btn" class="run" data-t="run_btn"></button>
    <button id="talk-btn" class="talk"><span class="talk__icon"></span><span class="talk__lbl">…</span></button>
  </section>

  <!-- overlay global (diálogos, duelos, resultados) -->
  <div id="modal" class="modal"></div>

</div>

<script src="js/save.js"></script>
<script src="js/feel.js"></script>
<script src="js/i18n.js"></script>
<script src="js/cards.js"></script>
<script src="js/audio.js"></script>
<script src="js/faces.js"></script>
<script src="js/ai.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/story.js"></script>
<script src="js/world.js"></script>
<script src="js/pixels.js"></script>
<script src="js/settings.js"></script>
<script src="js/collection.js"></script>
<script src="js/talk.js"></script>
<script src="js/main.js"></script>
</body>
</html>
